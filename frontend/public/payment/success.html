<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful — Fashion Girl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e2d3e 50%, #162032 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .success-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; margin: 0 auto 1.5rem;
            box-shadow: 0 8px 24px rgba(34,197,94,0.35);
        }
        h1 { color: #0f172a; font-size: 1.7rem; margin-bottom: 0.6rem; }
        .subtitle { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem; }
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        .info-row {
            display: flex; justify-content: space-between;
            font-size: 0.88rem; padding: 0.35rem 0;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row strong { color: #0f172a; }
        .btn {
            display: inline-block; width: 100%;
            padding: 0.9rem 1.5rem;
            background: linear-gradient(135deg, #e0252a, #b91c1c);
            color: white; font-weight: 700; font-size: 1rem;
            border: none; border-radius: 14px; cursor: pointer;
            text-decoration: none; transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(224,37,42,0.35);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(224,37,42,0.45); }
        .payhere-badge {
            margin-top: 1.5rem;
            display: flex; align-items: center; justify-content: center; gap: 0.4rem;
            color: #94a3b8; font-size: 0.78rem;
        }
        #timer { font-weight: 700; color: #0f172a; }
    </style>
</head>
<body>
<div class="card">
    <div class="success-icon">✓</div>
    <h1>Payment Successful! 🎉</h1>
    <p class="subtitle">Your order has been received and confirmed. Our tailor will begin working on your custom garment shortly.</p>

    <div class="info-box" id="paymentInfo">
        <div class="info-row"><span>Status</span><strong style="color:#16a34a">✓ Confirmed</strong></div>
        <div class="info-row" id="orderRow" style="display:none"><span>Order Reference</span><strong id="orderId">—</strong></div>
        <div class="info-row"><span>Gateway</span><strong>PayHere Sandbox</strong></div>
        <div class="info-row"><span>Next Step</span><strong>Tailor notified</strong></div>
    </div>

    <a href="/" class="btn">↩ Return to Fashion Girl</a>

    <p class="payhere-badge">
        🔒 Secured by PayHere &nbsp;|&nbsp; Redirecting in <span id="timer">10</span>s
    </p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order_id");
    if (orderId) {
        document.getElementById("orderId").textContent = "#" + orderId.slice(-8).toUpperCase();
        document.getElementById("orderRow").style.display = "flex";
    }

    let t = 10;
    const timerEl = document.getElementById("timer");
    const interval = setInterval(() => {
        t--;
        timerEl.textContent = t;
        if (t <= 0) {
            clearInterval(interval);
            window.location.href = "/";
        }
    }, 1000);
</script>
</body>
</html>
